name: Weather Continuous Ingestion

on:
  schedule:
    # Esegue lo script ogni giorno alle 08:00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch: # Ti permette di far partire lo script manualmente da GitHub

jobs:
  run-ingestion:
    runs-on: ubuntu-latest
    steps:
      # 1. Scarica il codice dal repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configura Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. Installa le dipendenze da requirements_start.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_start.txt

      # 4. Esegue lo script passando i 5 segreti di Supabase
      - name: Run ingestion script
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: python scripts/ingest_weather.py